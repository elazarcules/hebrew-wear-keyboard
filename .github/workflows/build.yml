name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk hebrew-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hebrew-keyboard
          path: hebrew-keyboard.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hebrew-keyboard.apk \
            --target "${{ github.sha }}" \
            --title "Build #${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --prerelease
